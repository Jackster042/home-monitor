services:
  postgres:
    image: postgres:16
    container_name: home-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-monitor-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ../docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    image: node:20-alpine
    container_name: home-monitor-backend
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @home-monitor/backend dev"
    env_file:
      - ../../.env.example
    ports:
      - "4000:4000"
    volumes:
      - ../../:/app
    depends_on:
      - postgres
      - mosquitto

  frontend:
    image: node:20-alpine
    container_name: home-monitor-frontend
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @home-monitor/frontend dev -- --host 0.0.0.0"
    env_file:
      - ../../.env.example
    ports:
      - "5173:5173"
    volumes:
      - ../../:/app
    depends_on:
      - backend

volumes:
  postgres-data:
